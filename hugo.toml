baseURL = 'https://profi-web-de.github.io/andres-romero/'
theme = 'PaperMod'
# Multilingüe: alemán por defecto (sirve en la raíz), español e inglés en subcarpeta.
# Esta clave DEBE ir antes de cualquier [tabla]: dentro de una, TOML la trata como
# clave de esa tabla y Hugo la ignora, cayendo silenciosamente a 'en'.
defaultContentLanguage = 'de'
buildFuture = true

# Las secciones de la portada (content/home/*) son fragmentos de contenido, no
# páginas: existen para que el CMS pueda editarlas por separado, y el layout de
# la home las lee con site.GetPage. El cascade vive aquí y no en el front matter
# para que el CMS no pueda borrarlo al guardar.
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'never'
  [cascade.target]
    path = '{/home,/home/**}'

# Google Analytics 4 — pendiente: hace falta crear una propiedad nueva para este
# sitio. Sin 'id' no se carga GA4 ni aparece el banner de consentimiento, que es
# justo lo que queremos hasta tenerlo.
# [services]
#   [services.googleAnalytics]
#     id = 'G-XXXXXXXXXX'

[languages]
  [languages.de]
    languageCode = 'de-DE'
    languageName = 'Deutsch'
    weight = 1
    title = 'Andrés Romero'
    [languages.de.params]
      description = 'Gitarrist, Komponist und Musikpädagoge in Erfurt'

  [languages.es]
    languageCode = 'es-ES'
    languageName = 'Español'
    weight = 2
    title = 'Andrés Romero'
    [languages.es.params]
      description = 'Guitarrista, compositor y pedagogo musical en Erfurt'

  [languages.en]
    languageCode = 'en-GB'
    languageName = 'English'
    weight = 3
    title = 'Andrés Romero'
    [languages.en.params]
      description = 'Guitarist, composer and music teacher based in Erfurt'

[params]
  # Fijado en claro: la identidad del sitio es el fondo, no una preferencia del
  # visitante. Si al final se elige la dirección oscura, esto pasa a 'dark'.
  defaultTheme = 'light'
  # El blanco es la identidad del sitio, no una preferencia: sin interruptor.
  disableThemeToggle = true
  ShowShareButtons = false
  ShowReadingTime = false
  images = ['og-default.jpg']
  author = 'Andrés Romero'
  [params.assets]
    favicon = 'favicon.svg'
    # Bermellón de la dirección Picó. El mismo valor va en static/favicon.svg
    # y en scripts/make-favicons.py.
    theme_color = '#e0402a'
    msapplication_TileColor = '#e0402a'
  copyright_name = 'Andrés Romero'
  [params.profileMode]
    enabled = true
  [params.developer]
    name = 'Pablo Johnson'
    url = 'https://github.com/pablo-johnson'
  [params.seo]
    # Completar con los perfiles en redes sociales del artista:
    # same_as = ["https://www.instagram.com/...", "https://www.youtube.com/@..."]
    job_title = 'Gitarrist, Komponist und Musikpädagoge'
    genre     = 'Klassische Musik'

